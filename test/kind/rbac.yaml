apiVersion: v1
kind: Pod
metadata:
  name: kp-restarting
  namespace: kp-allowed
  labels:
    app.kubernetes.io/name: kp-restarting
    app.kubernetes.io/part-of: kubepeep-kind-harness
    app.kubernetes.io/managed-by: kubepeep-kind-harness
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
  containers:
    - name: synthetic-log
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4
      command: ["/bin/sh", "-c", "echo 'possible error: synthetic dashboard fixture unavailable'; exit 1"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
