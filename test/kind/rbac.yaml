    app.kubernetes.io/part-of: kubepeep-kind-harness
    app.kubernetes.io/managed-by: kubepeep-kind-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kp-degraded
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kp-degraded
        app.kubernetes.io/part-of: kubepeep-kind-harness
        app.kubernetes.io/managed-by: kubepeep-kind-harness
    spec:
      automountServiceAccountToken: false
      # Keep this dashboard fixture deterministically unavailable without
      # relying on a mutable or deliberately missing container image.
      nodeSelector:
        kubepeep.dev/nonexistent-node: "true"
      containers:
        - name: unavailable
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
