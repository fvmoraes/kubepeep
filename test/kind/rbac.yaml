  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  volumes:
    - name: web-root
      emptyDir: {}
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4@sha256:2e0f836850e09b8b7cc937681d6194537a09fbd5f6b9e08f4d646a85128e8937
      command: ["/bin/sh", "-c"]
      args: ["printf 'synthetic current log ready\\n'; printf 'ok\\n' >/www/index.html; exec httpd -f -p 8080 -h /www"]
      ports:
        - name: http
          containerPort: 8080
      volumeMounts:
        - name: web-root
          mountPath: /www
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
    - name: utility
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4@sha256:2e0f836850e09b8b7cc937681d6194537a09fbd5f6b9e08f4d646a85128e8937
