    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
# The denied namespace contains the same Role only so the refresh scenario can
# add and remove one narrow RoleBinding. Neither test identity is bound here in
# the baseline fixture.
