# KubePeep — Release (CI → build → package → publish → latest)
#
# Filosofia de referência: .github/workflows/release.yml do Ginger.
#
# Fluxo (uma única run por push em main ou dispatch manual):
#
#   prepare       — analisa Conventional Commits desde a última tag oficial e
#                   calcula SemVer SEM prefixo "v"; commita metadados de
#                   versão (wails.json + CHANGELOG). Rápido: NÃO espera o
#                   verify e NÃO cria tag.
#         ↓                    (builds rodam em PARALELO com o verify.yml)
#   build-linux   — Wails nativo (ubuntu-24.04 / ubuntu-24.04-arm) →
#                   deb + rpm (nfpm) + tar.gz (CLI para install.sh)
#   build-windows — Wails nativo (windows-2025) → NSIS setup.exe + zip
#   build-macos   — Wails nativo (macos-15-intel / macos-15) → dmg + zip + tar.gz
#         ↓ (todos precisam passar; nada é publicado parcialmente)
#   publish       — espera o verify.yml do commit de origem; só então cria a
#                   tag imutável <X.Y.Z>, checksums.txt, SBOM SPDX e a GitHub
#                   Release marcada como Latest
#         ↓
#   update-latest — move a git tag móvel `latest` para o commit da release
#
# Regras:
#   - Tags oficiais: 1.0.0, 1.1.0, 1.1.1 — SEM prefixo "v" (imutáveis) e criadas
#     APENAS quando todos os builds e o verify passam (falha não queima versão).
#   - Apenas a git tag móvel `latest` é atualizada (force push só nela).
#   - Assets com nome CONSTANTE (kubepeep-linux-amd64.deb, …): cada Release tem
#     seu próprio namespace, e /releases/latest/download/<asset> é permanente.
#   - Nenhum binário é commitado no Git (dist/ é ignorado).
#   - PRs nunca publicam releases.

name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (skip disables the release)'
        required: false
        type: choice
        default: auto
        options: [auto, major, minor, patch, skip]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.7"
  NODE_VERSION: "24.18.0"
  NPM_VERSION: "11.16.0"
  WAILS_VERSION: "v2.15.0"
  NFPM_VERSION: "v2.43.1"

jobs:
  # ------------------------------------------------------------------ #
  # prepare — versionamento e metadados (rápido, sem tag)               #
  # ------------------------------------------------------------------ #
  prepare:
    name: prepare (SemVer + metadados)
    if: github.repository == 'fvmoraes/kubepeep' && github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - name: Check out source (full history for commit analysis)
        # persist-credentials permanece no default (true) APENAS aqui: este job
        # empurra o commit de metadados com o GITHUB_TOKEN delimitado.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject sensitive data and unsafe commit identities
        env:
          SECURITY_REF: ${{ github.sha }}
        run: ./scripts/security_check.sh "$SECURITY_REF"

      - name: Determine bump type
        id: bump
        env:
          DISPATCH_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          type="auto"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$DISPATCH_BUMP" in
              major|minor|patch) type="$DISPATCH_BUMP" ;;
              skip)              type="skip" ;;
              *)                 type="auto" ;;
            esac
          fi

          # Última tag oficial SEM prefixo v (ex.: 1.4.2)
          previous_tag=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          previous_tag=${previous_tag:-}

          # HEAD já versionado? (re-execução / dispatch no próprio commit)
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$type" = "auto" ]; then
            type=$(./scripts/release.sh bump-type "${previous_tag}")
          fi

          if [ "$type" = "skip" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release skipped (type=skip)."
            exit 0
          fi

          if [ -n "$previous_tag" ]; then
            count=$(git log --pretty=%s "${previous_tag}..HEAD" | wc -l | tr -d ' ')
          else
            count=$(git log --pretty=%s | wc -l | tr -d ' ')
          fi
          if [ "$count" -eq 0 ]; then
            echo "No commits since ${previous_tag:-beginning} — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_release=true"
            echo "bump_type=$type"
            echo "previous_tag=${previous_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Bump: ${type} · ${count} commit(s) since ${previous_tag:-beginning}"

      - name: Compute version
        id: version
        if: steps.bump.outputs.should_release == 'true'
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.bump_type }}
          PREVIOUS_TAG: ${{ steps.bump.outputs.previous_tag }}
        run: |
          set -euo pipefail
          previous=${PREVIOUS_TAG:-0.0.0}
          version=$(./scripts/release.sh next-version "$previous" "$BUMP_TYPE")
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Version '$version' is not valid SemVer"; exit 1
          }
          # Proteção contra tag duplicada (re-execuções / corridas)
          if git ls-remote --tags origin "refs/tags/${version}" | grep -q "refs/tags/${version}"; then
            echo "::error::Tag ${version} already exists on origin — aborting."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (previous: ${previous})"

      - name: Generate release notes and update CHANGELOG
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.bump.outputs.previous_tag }}
          BUMP_TYPE: ${{ steps.bump.outputs.bump_type }}
        run: |
          set -euo pipefail
          date=$(date -u +%Y-%m-%d)
          ./scripts/release.sh notes "${PREVIOUS_TAG}" "$VERSION" "$BUMP_TYPE" > release-notes.md
          ./scripts/release.sh changelog "$VERSION" "$date" "${PREVIOUS_TAG}"
          echo "Release notes prepared for ${VERSION}."

      - name: Update wails.json product version
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg version "$VERSION" '.info.productVersion = $version' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          grep productVersion wails.json

      - name: Commit version files and push (bot)
        id: metadata
        if: steps.bump.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wails.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version metadata changes to commit."
          else
            git commit -m "release: ${{ steps.version.outputs.version }} [skip ci]"
            git push origin "HEAD:main"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keep release notes for the publish job
        if: steps.bump.outputs.should_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # build-linux — Wails nativo + deb/rpm (nfpm) + tar.gz (CLI)           #
  # ------------------------------------------------------------------ #
  build-linux:
    name: build-linux (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            nfpm_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the release metadata commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"

      - name: Build the frontend (embedded via go:embed)
        run: make web-build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Record build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Warm the Go module cache for the build container
        # `wails build` roda `go mod tidy` antes de compilar; o tidy resolve
        # TAMBÉM dependências de teste (ex.: gomega). Baixamos o grafo inteiro
        # para que o tidy do container funcione com GOPROXY=off.
        run: |
          go mod tidy
          go mod download all

      # O binário desktop é compilado dentro de um container Ubuntu 22.04 para
      # compatibilidade de glibc (2.35) com Ubuntu 22.04+/Debian 12+, usando a
      # tag `webkit2_41` (libwebkit2gtk-4.1, disponível no 22.04+). Padrão
      # documentado em docs/desktop-build.md.
      - name: Build the Wails desktop binary (native container)
        env:
          BUILD_DATE: ${{ steps.build-date.outputs.date }}
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -v "$(go env GOMODCACHE)":/go/pkg/mod \
            -v "$(go env GOCACHE)":/root/.cache/go-build \
            -v "$(go env GOROOT)":/opt/go:ro \
            -v "$(go env GOPATH)/bin/wails":/go/bin/wails:ro \
            -e GOROOT=/opt/go -e GOPATH=/go -e GOMODCACHE=/go/pkg/mod \
            -e PATH=/opt/go/bin:/go/bin:/usr/bin:/bin \
            -e HOME=/root -e GOPROXY=off -e GOSUMDB=off \
            -e RELEASE_VERSION="${{ env.VERSION }}" \
            -e RELEASE_COMMIT="${GITHUB_SHA}" \
            -e BUILD_DATE \
            ubuntu:22.04 \
            bash -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config >/dev/null && \
            wails build -tags 'desktop,webkit2_41' -clean -s -skipbindings -nopackage -platform linux/${{ matrix.arch }} \
              -ldflags \"-s -w -X github.com/fvmoraes/kubepeep/internal/buildinfo.Version=\$RELEASE_VERSION -X github.com/fvmoraes/kubepeep/internal/buildinfo.Commit=\$RELEASE_COMMIT -X github.com/fvmoraes/kubepeep/internal/buildinfo.BuildDate=\$BUILD_DATE\" \
              -o kubePeep"

      - name: Verify the binary reports the release version
        run: |
          reported=$(./build/bin/kubePeep version 2>&1) || reported="$reported (binary exited non-zero)"
          echo "$reported"
          case "$reported" in
            *"version=${{ env.VERSION }}"*) : ;;
            *) echo "::error::binary reported '$reported' but expected version=${{ env.VERSION }} (ldflags did not reach the build?)" ; exit 1 ;;
          esac

      - name: Package deb and rpm (nfpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
          export PKG_VERSION="${{ env.VERSION }}" PKG_ARCH="${{ matrix.nfpm_arch }}"
          mkdir -p dist
          "$(go env GOPATH)/bin/nfpm" package -p deb -f build/linux/nfpm.yaml -t "dist/kubepeep-linux-${{ matrix.arch }}.deb"
          "$(go env GOPATH)/bin/nfpm" package -p rpm -f build/linux/nfpm.yaml -t "dist/kubepeep-linux-${{ matrix.arch }}.rpm"

      - name: Package the CLI archive (install.sh)
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/fvmoraes/kubepeep/internal/buildinfo.Version=${{ env.VERSION }} -X github.com/fvmoraes/kubepeep/internal/buildinfo.Commit=${GITHUB_SHA::7} -X github.com/fvmoraes/kubepeep/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/staging/kubePeep ./cmd/kubePeep
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/staging/
          tar -czf "dist/kubepeep-linux-${{ matrix.arch }}.tar.gz" -C dist/staging kubePeep README.md LICENSE THIRD_PARTY_NOTICES.md
          rm -rf dist/staging

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/kubepeep-linux-${{ matrix.arch }}.deb
            dist/kubepeep-linux-${{ matrix.arch }}.rpm
            dist/kubepeep-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ #
  # build-windows — Wails nativo + NSIS installer                       #
  # ------------------------------------------------------------------ #
  build-windows:
    name: build-windows (amd64)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the release metadata commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # O Wails não baixa o NSIS: sem makensis no PATH ele apenas avisa e pula
      # o instalador. Garantimos o NSIS antes do build.
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) {
            Write-Output "makensis: $($makensis.Source)"
          } else {
            $nsisPath = 'C:\Program Files (x86)\NSIS'
            if (Test-Path (Join-Path $nsisPath 'makensis.exe')) {
              Add-Content $env:GITHUB_PATH $nsisPath
              Write-Output "makensis added to PATH for subsequent steps: $nsisPath"
            } else {
              throw 'makensis is still unavailable after NSIS installation'
            }
          }

      # O Wails executa o frontend (npm ci + npm run build) conforme wails.json.
      # `-nsis` gera o instalador oficial; `-webview2 embed` embute o bootstrapper.
      - name: Build the Wails desktop app and NSIS installer
        shell: pwsh
        run: >
          wails build -tags desktop -clean -skipbindings -platform windows/amd64
          -nsis -webview2 embed
          -ldflags "-s -w -X github.com/fvmoraes/kubepeep/internal/buildinfo.Version=${{ env.VERSION }} -X github.com/fvmoraes/kubepeep/internal/buildinfo.Commit=$('${{ github.sha }}'.Substring(0,7)) -X github.com/fvmoraes/kubepeep/internal/buildinfo.BuildDate=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"

      - name: Verify the binary reports the release version
        shell: pwsh
        run: |
          & .\build\bin\kubePeep.exe version
          $out = & .\build\bin\kubePeep.exe version | Out-String
          if ($out -notmatch [Regex]::Escape("version=${{ env.VERSION }}")) { throw 'version mismatch' }

      # Cobertura migrada do antigo native-archive-smoke (verify.yml):
      # valida o modo serve do binário Windows publicável de ponta a ponta.
      - name: Smoke the serve mode (loopback health)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kubepeep-serve-localappdata'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $binary = Join-Path (Get-Location) 'build\bin\kubePeep.exe'
          $process = Start-Process -FilePath $binary -ArgumentList @('serve', '--no-browser') -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            foreach ($attempt in 1..100) {
              if ($process.HasExited) { throw "serve process exited before readiness (code $($process.ExitCode))" }
              try {
                $status = & $binary status 2>$null | Out-String
                if ($LASTEXITCODE -eq 0 -and $status -match 'port=([0-9]+)') {
                  $port = [int]$Matches[1]
                  Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/health" | Out-Null
                  Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/api/v1/status" | Out-Null
                  $healthy = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 100
            }
            if (-not $healthy) { throw 'serve smoke did not reach a healthy loopback state' }
          } finally {
            & $binary stop *> $null
            if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id -Force }
          }

      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item .\build\bin\kubePeep.exe .\dist\kubePeep.exe
          $installer = Get-ChildItem .\build\bin -Filter '*installer*.exe' -Recurse | Select-Object -First 1
          if ($null -eq $installer) {
            Write-Output "build/bin contents:"
            Get-ChildItem .\build\bin -Recurse | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Output
            throw 'NSIS installer was not produced'
          }
          Copy-Item $installer.FullName .\dist\kubepeep-windows-amd64-setup.exe
          $staging = Join-Path $env:RUNNER_TEMP 'kubepeep-windows-zip'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item .\build\bin\kubePeep.exe (Join-Path $staging 'kubePeep.exe')
          Copy-Item .\README.md, .\LICENSE, .\THIRD_PARTY_NOTICES.md $staging
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath .\dist\kubepeep-windows-amd64.zip
          Get-ChildItem .\dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-amd64
          path: |
            dist/kubepeep-windows-amd64-setup.exe
            dist/kubepeep-windows-amd64.zip
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ #
  # build-macos — Wails nativo + dmg/zip (Intel e Apple Silicon)         #
  # ------------------------------------------------------------------ #
  build-macos:
    name: build-macos (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the release metadata commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"

      - name: Build the frontend (embedded via go:embed)
        run: make web-build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Sem -nopackage: o Wails gera o bundle nativo .app no macOS.
      - name: Build the Wails desktop app bundle
        run: |
          wails build -tags desktop -clean -s -skipbindings -platform darwin/${{ matrix.arch }} \
            -ldflags "-s -w -X github.com/fvmoraes/kubepeep/internal/buildinfo.Version=${{ env.VERSION }} -X github.com/fvmoraes/kubepeep/internal/buildinfo.Commit=$(git rev-parse --short HEAD) -X github.com/fvmoraes/kubepeep/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify the binary reports the release version
        run: |
          ./build/bin/kubePeep.app/Contents/MacOS/kubePeep version
          ./build/bin/kubePeep.app/Contents/MacOS/kubePeep version | grep -F "version=${{ env.VERSION }}"

      - name: Package dmg, zip and CLI archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/kubePeep.app dist/kubepeep-darwin-${{ matrix.arch }}.zip
          hdiutil create -volname "KubePeep" -srcfolder build/bin/kubePeep.app -ov -format UDZO "dist/kubepeep-darwin-${{ matrix.arch }}.dmg"
          staging=$(mktemp -d)
          cp build/bin/kubePeep.app/Contents/MacOS/kubePeep "$staging/kubePeep"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$staging/"
          tar -czf "dist/kubepeep-darwin-${{ matrix.arch }}.tar.gz" -C "$staging" kubePeep README.md LICENSE THIRD_PARTY_NOTICES.md
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-${{ matrix.arch }}
          path: |
            dist/kubepeep-darwin-${{ matrix.arch }}.dmg
            dist/kubepeep-darwin-${{ matrix.arch }}.zip
            dist/kubepeep-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ #
  # publish — gate de verify + tag + checksums + SBOM + Release (Latest) #
  # ------------------------------------------------------------------ #
  publish:
    name: publish (tag · checksums · SBOM · Release Latest)
    needs: [prepare, build-linux, build-windows, build-macos]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      METADATA_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Require successful verification of the originating commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Os builds rodam em paralelo com o verify.yml; só publicamos quando
          # o verify do commit de ORIGEM termina com sucesso. O commit de
          # metadados usa [skip ci] por design — altera apenas wails.json e
          # CHANGELOG, nenhum código.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            state=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "build-and-test") | .conclusion] | join(",")' 2>/dev/null || echo "")
            case "$state" in
              *success*)
                echo "verify.yml concluded successfully for ${GITHUB_SHA}."
                break
                ;;
              *failure*|*cancelled*|*timed_out*|*action_required*)
                echo "::error::verify.yml did not succeed for ${GITHUB_SHA} (state: ${state}). Release aborted — no tag was created."
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for verify.yml on ${GITHUB_SHA} (last state: ${state:-none})."
              exit 1
            fi
            echo "Waiting for verify.yml on ${GITHUB_SHA} (state: ${state:-none})..."
            sleep 60
          done

      - name: Check out the release metadata commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Create the immutable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} already exists on origin — refusing to overwrite."
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${METADATA_SHA}" > /dev/null
          echo "Tag ${TAG} → ${METADATA_SHA:0:7}"

      - name: Download all validated build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{linux-amd64,linux-arm64,windows-amd64,darwin-amd64,darwin-arm64,release-notes}'
          path: dist
          merge-multiple: true

      - name: Validate the exact asset allowlist
        run: |
          set -euo pipefail
          expected=(
            kubepeep-linux-amd64.deb
            kubepeep-linux-arm64.deb
            kubepeep-linux-amd64.rpm
            kubepeep-linux-arm64.rpm
            kubepeep-linux-amd64.tar.gz
            kubepeep-linux-arm64.tar.gz
            kubepeep-windows-amd64-setup.exe
            kubepeep-windows-amd64.zip
            kubepeep-darwin-amd64.dmg
            kubepeep-darwin-arm64.dmg
            kubepeep-darwin-amd64.zip
            kubepeep-darwin-arm64.zip
            kubepeep-darwin-amd64.tar.gz
            kubepeep-darwin-arm64.tar.gz
            release-notes.md
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset" || { echo "::error::missing or empty asset: $asset"; exit 1; }
          done
          regex=$(printf '%s|' "${expected[@]}"); regex="dist/(${regex%|})\$"
          extra=$(find dist -mindepth 1 -maxdepth 1 -type f | grep -vE "$regex" || true)
          if [ -n "$extra" ]; then echo "::error::unexpected files in dist: $extra"; exit 1; fi
          echo "All ${#expected[@]} expected assets present."

      - name: Smoke the release candidate binary
        run: |
          staging=$(mktemp -d)
          tar -xzf dist/kubepeep-linux-amd64.tar.gz -C "$staging"
          "$staging/kubePeep" version
          "$staging/kubePeep" version | grep -F "version=${{ env.VERSION }}"

      - name: Generate checksums.txt
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt
          for asset in kubepeep-*; do
            sha256sum "$asset" >> checksums.txt
          done
          cat checksums.txt

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft scan dir:. --source-name "kubepeep" \
            -o spdx-json > "dist/kubepeep-${{ env.VERSION }}.spdx.json"

      - name: Create the GitHub Release (Latest) from the immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — refusing to overwrite immutable assets."
            exit 1
          fi
          gh release create "$TAG" \
            dist/kubepeep-linux-*.deb \
            dist/kubepeep-linux-*.rpm \
            dist/kubepeep-linux-*.tar.gz \
            dist/kubepeep-windows-amd64-setup.exe \
            dist/kubepeep-windows-amd64.zip \
            dist/kubepeep-darwin-*.dmg \
            dist/kubepeep-darwin-*.zip \
            dist/kubepeep-darwin-*.tar.gz \
            dist/checksums.txt \
            "dist/kubepeep-${{ env.VERSION }}.spdx.json" \
            --latest \
            --verify-tag \
            --title "KubePeep $TAG" \
            --notes-file dist/release-notes.md
          echo "Release $TAG published and marked as Latest."

  # ------------------------------------------------------------------ #
  # update-latest — git tag móvel latest → commit da release             #
  # ------------------------------------------------------------------ #
  update-latest:
    name: update-latest (móvel)
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release metadata commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Move the mobile latest tag to the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "Moving refs/tags/latest → ${sha} (${TAG})"
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" -f sha="$sha" > /dev/null
          fi
          echo "Verifying..."
          got=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" --jq '.object.sha')
          test "$got" = "$sha" || { echo "::error::latest tag did not move"; exit 1; }
          echo "refs/tags/latest → $(echo "$got" | cut -c1-7) (same commit as ${TAG})"

      - name: Smoke the permanent download URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          location=$(curl -s -o /dev/null -w '%{redirect_url}' \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/checksums.txt")
          echo "Permanent URL redirects to: $location"
          case "$location" in
            *"/tag/${TAG}/checksums.txt"*) echo "Permanent download URL OK." ;;
            *) echo "::error::Permanent URL did not resolve to tag ${TAG}"; exit 1 ;;
          esac
