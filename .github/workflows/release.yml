name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'fvmoraes/kubepeep'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Reject sensitive data and unsafe commit or tag identities
        env:
          SECURITY_REF: ${{ github.ref }}
        run: ./scripts/security_check.sh "$SECURITY_REF"

      - name: Require successful main verification for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          successful_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?event=push&status=success&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .conclusion == \"success\")) | length")
          test "$successful_runs" -ge 1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.7
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Validate source, installers, and embedded application
        run: |
          cd web
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          cd ..
          sh -n install.sh scripts/install_test.sh
          ./scripts/install_test.sh
          go mod verify
          mapfile -t packages < <(go list ./... | grep -v '/web/node_modules/')
          go vet "${packages[@]}"
          go test -count=1 "${packages[@]}"
          go test -count=1 -race ./internal/...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 "${packages[@]}"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/fvmoraes/ginger/cmd/ginger@v1.4.4
          ginger inspect
          ginger doctor

      - name: Build the exact non-published release candidate
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish --skip=announce

      - name: Upload candidate archives for native gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  native-smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out immutable smoke harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go for native adversarial tests
        if: matrix.goos == 'windows'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.7
          cache-dependency-path: go.sum

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist

      - name: Verify and execute Unix archive
        if: matrix.goos != 'windows'
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          archive=$(find dist -maxdepth 1 -type f -name "kubePeep_*_${TARGET_OS}_${TARGET_ARCH}.tar.gz" -print -quit)
          test -n "$archive"
          archive_name=$(basename "$archive")
          expected=$(awk -v name="$archive_name" '$2 == name || $2 == "*" name { print $1 }' dist/checksums.txt)
          test -n "$expected"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          extract="$RUNNER_TEMP/kubepeep-release-candidate"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          test -f "$extract/README.md"
          test -f "$extract/LICENSE"
          test -f "$extract/THIRD_PARTY_NOTICES.md"
          test "$(find "$extract" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 4
          ./scripts/smoke.sh "$extract/kubePeep"

          fake_bin="$RUNNER_TEMP/kubepeep-installer-bin"
          install_home="$RUNNER_TEMP/kubepeep-installer-home"
          mkdir -p "$fake_bin" "$install_home"
          cat >"$fake_bin/curl" <<'EOF'
          #!/bin/sh
          set -eu
          output=
          url=
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --output) output=$2; shift 2 ;;
              https://*) url=$1; shift ;;
              *) shift ;;
            esac
          done
          [ -n "$output" ] && [ -n "$url" ]
          cp "$KUBEPEEP_CANDIDATE_DIR/${url##*/}" "$output"
          EOF
          chmod 0755 "$fake_bin/curl"
          version=${GITHUB_REF_NAME#v}
          KUBEPEEP_CANDIDATE_DIR="$GITHUB_WORKSPACE/dist" HOME="$install_home" PATH="$fake_bin:$PATH" \
            ./install.sh --version "$version"
          "$install_home/.local/bin/kubePeep" version | grep -F "version=$version"
          HOME="$install_home" PATH="$fake_bin:$PATH" ./install.sh --uninstall

      - name: Verify and execute Windows archive
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          & ./scripts/install_test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer adversarial suite failed' }
          & go test -count=1 ./internal/updater ./internal/cli
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater or CLI native tests failed' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error }
          $archive = Get-ChildItem -LiteralPath dist -Filter "kubePeep_*_windows_$env:TARGET_ARCH.zip" | Select-Object -First 1
          if ($null -eq $archive) { throw 'release candidate archive was not found' }
          $line = Get-Content -LiteralPath dist/checksums.txt | Where-Object { $_ -match ("\s+\*?" + [Regex]::Escape($archive.Name) + '$') }
          if (@($line).Count -ne 1) { throw 'checksum entry is missing or duplicated' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'release candidate checksum mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'kubepeep-release-candidate'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $requiredFiles = @('README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'kubePeep.exe')
          $actualFiles = @(Get-ChildItem -LiteralPath $extract -Force)
          if ($actualFiles.Count -ne $requiredFiles.Count -or @($actualFiles | Where-Object { $_.PSIsContainer -or $_.Name -notin $requiredFiles }).Count -ne 0) {
            throw 'archive contents do not match the exact release allowlist'
          }
          foreach ($required in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $extract $required))) { throw "archive is missing $required" }
          }
          $binary = Join-Path $extract 'kubePeep.exe'
          & $binary version
          if ($LASTEXITCODE -ne 0) { throw 'version command failed' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kubepeep-localappdata'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $process = Start-Process -FilePath $binary -ArgumentList @('start', '--no-browser') -PassThru
          try {
            $status = $null
            foreach ($attempt in 1..200) {
              $status = (& $binary status 2>$null | Out-String)
              if ($LASTEXITCODE -eq 0 -and $status -match 'port=([0-9]+)') { break }
              if ($process.HasExited) { throw 'process exited before readiness' }
              Start-Sleep -Milliseconds 100
            }
            if ($status -notmatch 'port=([0-9]+)') { throw 'status did not publish a port' }
            Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$([int]$Matches[1])/health" | Out-Null
            & $binary stop *> $null
            if ($LASTEXITCODE -ne 0) { throw 'stop command failed' }
            if (-not $process.WaitForExit(10000)) { throw 'process did not stop cleanly' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $install = Join-Path $env:RUNNER_TEMP 'kubepeep-installer-candidate'
          $env:KUBEPEEP_CANDIDATE_DIR = (Resolve-Path ./dist).Path
          function global:Invoke-WebRequest {
            [CmdletBinding()]
            param([switch]$UseBasicParsing, [Parameter(Mandatory=$true)][string]$Uri, [Parameter(Mandatory=$true)][string]$OutFile)
            $name = [IO.Path]::GetFileName(([Uri]$Uri).AbsolutePath)
            Copy-Item -LiteralPath (Join-Path $env:KUBEPEEP_CANDIDATE_DIR $name) -Destination $OutFile
          }
          try {
            & ./install.ps1 -Version $version -InstallDir $install | Out-Null
            & (Join-Path $install 'kubePeep.exe') version
            if ($LASTEXITCODE -ne 0) { throw 'installed release candidate did not execute' }
            & ./install.ps1 -Uninstall -InstallDir $install | Out-Null
          } finally {
            Remove-Item Function:\global:Invoke-WebRequest -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\KUBEPEEP_CANDIDATE_DIR -ErrorAction SilentlyContinue
          }

  publish:
    needs: native-smoke
    if: github.repository == 'fvmoraes/kubepeep'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag again
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Download the exact natively validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist

      - name: Publish the exact validated files without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for asset in \
            "kubePeep_${version}_darwin_amd64.tar.gz" \
            "kubePeep_${version}_darwin_arm64.tar.gz" \
            "kubePeep_${version}_linux_amd64.tar.gz" \
            "kubePeep_${version}_linux_arm64.tar.gz" \
            "kubePeep_${version}_windows_amd64.zip" \
            "kubePeep_${version}_windows_arm64.zip" \
            checksums.txt; do
            test -f "dist/$asset"
          done
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 7
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt install.sh install.ps1 \
            --verify-tag \
            --title "Kube Peep ${GITHUB_REF_NAME}" \
            --generate-notes
