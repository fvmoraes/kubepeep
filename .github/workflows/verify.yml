name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and audit frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Verify frontend
        working-directory: web
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run build

      - name: Install browser for frontend E2E
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify frontend E2E
        working-directory: web
        run: npm run test:e2e

      - name: Verify Go module and formatting
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(find cmd internal -type f -name '*.go' -exec gofmt -l {} +)"
          go mod verify

      - name: Test and build embedded binary
        env:
          CGO_ENABLED: "0"
        run: |
          go list ./... | grep -v '/web/node_modules/' | xargs go vet
          go list ./... | grep -v '/web/node_modules/' | xargs go test
          go build -trimpath -o dist/kubePeep ./cmd/kubePeep

      - name: Verify Ginger project
        run: |
          go install github.com/fvmoraes/ginger/cmd/ginger@v1.4.4
          ginger inspect
          ginger doctor

  native-runtime:
    name: native-runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test native paths, permissions, locks, control lifecycle, and doctor
        env:
          CGO_ENABLED: "0"
          KUBEPEEP_NATIVE_BLACKBOX: "1"
        run: go test -count=1 ./internal/adapters/userdirs ./internal/securefs ./internal/runtime ./internal/cli
