name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.7
          cache-dependency-path: go.sum

      - name: Reject sensitive data and unsafe commit identities
        env:
          SECURITY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/security_check.sh "$SECURITY_REF"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Install and audit frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Verify frontend
        working-directory: web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install browser for frontend E2E
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify frontend E2E
        working-directory: web
        run: npm run test:e2e

      - name: Verify Go module and formatting
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(find cmd internal -type f -name '*.go' -exec gofmt -l {} +)"
          go mod verify

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify Unix installer
        run: |
          sh -n install.sh scripts/install_test.sh
          ./scripts/install_test.sh

      - name: Test and build embedded binary
        env:
          CGO_ENABLED: "0"
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/web/node_modules/')
          go vet "${packages[@]}"
          go test -count=1 "${packages[@]}"
          go build -trimpath -o dist/kubePeep ./cmd/kubePeep
          ./scripts/smoke.sh dist/kubePeep

      - name: Run the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./internal/...

      - name: Scan reachable Go vulnerabilities
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/web/node_modules/')
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 "${packages[@]}"

      - name: Verify Ginger project
        run: |
          go install github.com/fvmoraes/ginger/cmd/ginger@v1.4.4
          ginger inspect
          ginger doctor

  native-runtime:
    name: native-runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.7
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        shell: bash
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Build embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test native paths, permissions, locks, control lifecycle, and doctor
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "0"
          KUBEPEEP_NATIVE_BLACKBOX: "1"
        run: go test -count=1 ./internal/adapters/userdirs ./internal/securefs ./internal/runtime ./internal/updater ./internal/cli

      - name: Parse native installer
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Test native paths, permissions, locks, control lifecycle, and doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          KUBEPEEP_NATIVE_BLACKBOX: "1"
        run: |
          $lines = & go test -count=1 ./internal/adapters/userdirs ./internal/securefs ./internal/runtime ./internal/updater ./internal/cli 2>&1
          $exitCode = $LASTEXITCODE
          $lines | Write-Output
          if ($exitCode -ne 0) {
            $diagnostic = (($lines | Select-Object -Last 30) -join "`n")
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Windows test diagnostic::$diagnostic"
            exit $exitCode
          }

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
          }

      - name: Test Windows installer checksum, archive, uninstall, and purge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = & ./scripts/install_test.ps1 2>&1
          $scriptSucceeded = $?
          $exitCode = if ($scriptSucceeded -and ($null -eq $LASTEXITCODE -or $LASTEXITCODE -eq 0)) {
            0
          } elseif ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            [int]$LASTEXITCODE
          } else {
            1
          }
          if ($exitCode -eq 0) {
            $lines | Write-Output
            exit 0
          }
          $diagnosticPattern = '^install-test stage=(?:static-hash-api|fixture-build|initial-install|fixture-guard|version-validation|transaction-lock|upgrade|checksum-validation|archive-validation|candidate-validation|rollback|reparse-binary|uninstall|path-ownership|reparse-data|argument-validation|architecture|purge|cleanup|unknown) type=[A-Za-z][A-Za-z0-9]{0,63} hresult=0x[0-9A-F]{8}$'
          $safeTail = @($lines | Select-Object -Last 30 | ForEach-Object {
            $line = [string]$_
            if ($line -match $diagnosticPattern) {
              $line
            } else {
              '[non-diagnostic output redacted]'
            }
          })
          if (@($safeTail -match $diagnosticPattern).Count -eq 0) {
            $safeTail = @($safeTail | Select-Object -Last 29) + 'install-test stage=unknown type=ProcessFailure hresult=0x00000001'
          }
          $safeTail | Write-Output
          $diagnostic = ($safeTail -join "`n")
          $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Windows installer test diagnostic::$diagnostic"
          exit $exitCode

  restricted-kind:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.7
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm and build the embedded application
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          cd web
          npm ci
          npm run build
          cd ..
          CGO_ENABLED=0 go build -trimpath -o dist/kubePeep ./cmd/kubePeep

      - name: Install pinned Kind
        env:
          KIND_VERSION: v0.32.0
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          KUBECTL_VERSION: v1.36.3
          KUBECTL_SHA256: ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336
        run: |
          mkdir -p "$RUNNER_TEMP/kubepeep-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" \
            --output "$RUNNER_TEMP/kubepeep-bin/kind"
          echo "$KIND_SHA256  $RUNNER_TEMP/kubepeep-bin/kind" | sha256sum --check --strict
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "$RUNNER_TEMP/kubepeep-bin/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/kubepeep-bin/kubectl" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/kubepeep-bin/kind"
          chmod 0755 "$RUNNER_TEMP/kubepeep-bin/kubectl"
          echo "$RUNNER_TEMP/kubepeep-bin" >> "$GITHUB_PATH"

      - name: Create and validate restricted cluster
        run: |
          restricted_stage() {
            stage=$1
            shift
            if "$@"; then
              return 0
            fi
            printf '::error title=Restricted Kind diagnostic::stage=%s status=failed\n' "$stage"
            return 1
          }
          restricted_stage create ./test/kind/harness.sh create
          restricted_stage validate ./test/kind/harness.sh validate
          restricted_stage kubeconfigs ./test/kind/harness.sh kubeconfigs
          restricted_stage app-e2e ./test/kind/harness.sh app-e2e ./dist/kubePeep

      - name: Remove ephemeral CI cluster
        if: always()
        run: kind delete cluster --name kubepeep-f4
